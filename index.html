<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Young 8 - Hệ thống Ôn tập & Quản lý Học tập Lớp 8</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root">
      <div id="app-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #4F46E5; background-color: #F8FAFC;">
        <div style="width: 48px; height: 48px; border: 4px solid #E0E7FF; border-top-color: #4F46E5; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-weight: 700; font-size: 15px; color: #1E293B;">Đang khởi động English Young 8...</p>
        <button id="clear-cache-btn" style="display: none; margin-top: 16px; padding: 8px 16px; border-radius: 8px; background: #EF4444; color: white; border: none; font-size: 13px; font-weight: 600; cursor: pointer;" onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();">Xóa cache & Tải lại</button>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        <script>
          setTimeout(function() {
            var btn = document.getElementById('clear-cache-btn');
            if (btn && document.getElementById('app-initial-loader')) {
              btn.style.display = 'inline-block';
            }
          }, 3500);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
