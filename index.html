<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Young 8 - Ôn tập & Luyện thi Tiếng Anh 8 Global Success</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Thanh chọn môn học (Sẵn sàng mở rộng sang nhiều môn Lớp 8) -->
  <div class="top-subject-bar">
    <div class="top-subject-inner">
      <span>🎓 <strong>Cổng Học Tập & Luyện Thi Lớp 8</strong> (Chương trình GDPT Mới)</span>
      <div class="subject-pills">
        <button class="subject-pill active">🇬🇧 Tiếng Anh 8 (Global Success)</button>
        <button class="subject-pill coming-soon" onclick="notifyFutureSubject('Toán 8')">📐 Toán 8 (+Sắp mở)</button>
        <button class="subject-pill coming-soon" onclick="notifyFutureSubject('Khoa học tự nhiên 8')">🧪 KHTN 8 (+Sắp mở)</button>
        <button class="subject-pill coming-soon" onclick="notifyFutureSubject('Ngữ Văn 8')">📖 Ngữ Văn 8 (+Sắp mở)</button>
      </div>
    </div>
  </div>

  <!-- Thanh điều hướng chính -->
  <header class="main-header">
    <div class="header-inner">
      <div class="brand" onclick="switchMainTab('dashboard')">
        <div class="brand-logo">E8</div>
        <div class="brand-text">
          <h1>English Young 8</h1>
          <p>Global Success • Học kì 1 (Unit 1 – Unit 6)</p>
        </div>
      </div>

      <nav class="nav-tabs">
        <button class="nav-tab active" data-tab="dashboard" onclick="switchMainTab('dashboard')">
          🏠 Tổng quan
        </button>
        <button class="nav-tab" data-tab="unit-study" onclick="switchMainTab('unit-study')">
          📚 Học theo Unit (1–6)
        </button>
        <button class="nav-tab" data-tab="exams" onclick="switchMainTab('exams')">
          📝 Phòng Luyện Đề Thi
        </button>
        <button class="nav-tab" data-tab="mistakes" onclick="switchMainTab('mistakes')">
          📓 Sổ Tay Câu Sai
          <span id="nav-mistake-badge" class="badge-count" style="display:none">0</span>
        </button>
        <button class="nav-tab" data-tab="analytics" id="nav-tab-analytics" onclick="switchMainTab('analytics')">
          📈 Tiến Độ Của Em
        </button>
      </nav>

      <!-- Khung hiển thị tài khoản / Đăng nhập (Học sinh & Admin) -->
      <div id="header-user-container"></div>
    </div>
  </header>

  <!-- Nội dung chính được render động bởi js/app.js -->
  <main class="container" id="app-root">
    <div style="text-align:center; padding: 60px 20px; color: #64748B;">
      Đang tải dữ liệu học tập Tiếng Anh 8 Global Success...
    </div>
  </main>

  <!-- Root cho các cửa sổ Modal Popup (Cài đặt Supabase, Chi tiết bài thi) -->
  <div id="modal-root"></div>

  <footer class="footer">
    <p><strong>English Young 8</strong> — Hệ thống Ôn tập & Luyện thi Tiếng Anh 8 Global Success (Hỗ trợ đồng bộ đám mây Supabase PostgreSQL).</p>
  </footer>

  <!-- Nạp dữ liệu Học kì 1 (Unit 1-3, Unit 4-6 và Bộ đề thi HK1) -->
  <script src="data/units_1_3.js"></script>
  <script src="data/units_4_6.js"></script>
  <script src="data/exams_hk1.js"></script>
  <!-- Nạp module Supabase Cloud -->
  <script src="js/supabase-client.js"></script>
  <!-- Nạp logic điều khiển ứng dụng chính -->
  <script src="js/app.js"></script>
</body>
</html>
